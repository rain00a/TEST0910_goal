<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成就記錄</title>

  <!-- Google Fonts：思源宋體（標題）+ 思源黑體（內文），對應規格第 5 節字體決策 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles/theme.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
</head>
<body>
  <!-- 裝飾用深空背景光暈，純視覺不影響互動，對讀屏軟體隱藏 -->
  <div class="bg-decor" aria-hidden="true">
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
    <div class="bg-glow bg-glow--3"></div>
  </div>

  <main class="app-shell">
    <header class="app-header">
      <h1 class="app-title">成就記錄</h1>
    </header>

    <!-- 週次時間軸：僅週次檢視顯示（對應規格第 5 節「時間軸+週次膠囊」） -->
    <nav id="week-capsule-timeline" class="week-capsule-timeline" hidden></nav>

    <div class="period-nav">
      <button id="prev-btn" type="button" class="nav-btn" aria-label="上一個">◀</button>
      <div class="period-label">
        <p id="view-label" class="view-label"></p>
        <p id="count-label" class="count-label" hidden></p>
      </div>
      <button id="next-btn" type="button" class="nav-btn" aria-label="下一個">▶</button>
    </div>

    <div class="export-row">
      <button id="export-btn" type="button" class="export-link-btn">匯出 .xlsx</button>
    </div>

    <section class="glass-panel" aria-live="polite">
      <p id="empty-state" class="empty-state" hidden>這段期間還沒有任何記錄，新增第一筆成就開始累積吧。</p>
      <div id="achievement-list"></div>
    </section>
  </main>

  <!-- 四角固定功能鍵，對應規格 2.6.1 -->
  <div class="corner corner--top-left">
    <div class="view-switcher" role="tablist" aria-label="檢視模式切換">
      <button type="button" data-view-tab="week" aria-pressed="true">週</button>
      <button type="button" data-view-tab="month" aria-pressed="false">月</button>
      <button type="button" data-view-tab="year" aria-pressed="false">年</button>
    </div>
  </div>

  <button
    type="button"
    id="settings-btn"
    class="corner corner--top-right icon-btn"
    title="設定（尚未開放，規劃中）"
    aria-label="設定（尚未開放）"
    disabled
  >⚙</button>

  <button type="button" id="search-btn" class="corner corner--bottom-left icon-btn" aria-label="搜尋">🔍</button>

  <button type="button" id="add-achievement-btn" class="corner corner--bottom-right add-btn" aria-label="新增成就">＋</button>

  <!-- SheetJS（xlsx 匯出用），對應規格第 4 節技術決策 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
